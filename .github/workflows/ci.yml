name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: unit and smoke tests
        run: go test -race -count=1 ./...
      - name: build
        run: CGO_ENABLED=0 go build -o thicket ./cmd/thicket
      - name: binary smoke test
        run: |
          ./thicket version
          # Discord is optional (web app only): the check passes but says so.
          THICKET_DATA_DIR=$(mktemp -d) ./thicket check 2> check.txt
          grep -q "DISCORD_TOKEN is not set, so Discord is off" check.txt
          # A real problem must still fail loudly and name it.
          if THICKET_DATA_DIR=/proc/thicket-nope ./thicket check 2> check.txt; then exit 1; fi
          grep -q "MISSING" check.txt
          THICKET_DATA_DIR=$(mktemp -d) ./thicket migrate

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build --build-arg VERSION=${{ github.sha }} -t thicket:ci .
      - name: image smoke test
        run: docker run --rm thicket:ci version
      - name: build sandbox image
        run: docker build -f sandbox/Dockerfile -t thicket-sandbox:ci .
      - name: sandbox smoke test
        run: |
          docker run -d --name sb -e SANDBOX_TOKEN_FILE=/tmp/token thicket-sandbox:ci
          docker exec sb sh -c 'echo tok > /tmp/token'
          for i in $(seq 1 20); do docker exec sb curl -fs http://127.0.0.1:7070/health && break; sleep 1; done
          docker exec sb curl -fs -H 'Authorization: Bearer tok' -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"run_command","arguments":{"command":"python3 -c \"print(6*7)\""}}}' \
            http://127.0.0.1:7070/mcp | grep -q 42
          docker rm -f sb

  # Publish the image docker-compose.yml points at, only on pushes to main
  # (never from pull requests) and only after tests pass. Uses the repo's
  # own GITHUB_TOKEN.
  publish:
    if: github.event_name == 'push'
    needs: [test, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: build and push
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build --build-arg VERSION=${{ github.sha }} -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker build -f sandbox/Dockerfile -t "$IMAGE-sandbox:latest" -t "$IMAGE-sandbox:${{ github.sha }}" .
          docker push "$IMAGE-sandbox:latest"
          docker push "$IMAGE-sandbox:${{ github.sha }}"
