name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: unit and smoke tests
        run: go test -race -count=1 ./...
      - name: build
        run: CGO_ENABLED=0 go build -o thicket ./cmd/thicket
      - name: binary smoke test
        run: |
          ./thicket version
          # With no DISCORD_TOKEN the first-run check must fail loudly and name it.
          if THICKET_DATA_DIR=$(mktemp -d) ./thicket check 2> check.txt; then exit 1; fi
          grep -q "DISCORD_TOKEN is not set" check.txt
          THICKET_DATA_DIR=$(mktemp -d) ./thicket migrate

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build --build-arg VERSION=${{ github.sha }} -t thicket:ci .
      - name: image smoke test
        run: docker run --rm thicket:ci version

  # Publish the image docker-compose.yml points at, only on pushes to main
  # (never from pull requests) and only after tests pass. Uses the repo's
  # own GITHUB_TOKEN.
  publish:
    if: github.event_name == 'push'
    needs: [test, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: build and push
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build --build-arg VERSION=${{ github.sha }} -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
