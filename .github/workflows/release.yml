name: release

# A tag like v0.2.0 publishes that version: multi-arch images tagged
# 0.2.0, 0.2 and latest, and a GitHub release whose notes are the
# version's section of CHANGELOG.md. A tag without a section fails before
# anything is published. Pre-releases (v0.2.0-rc.1) get only their own
# tag and never move `latest`.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: release notes from CHANGELOG.md
        run: go run ./cmd/thicket changelog "$GITHUB_REF_NAME" > notes.md
      - name: tests
        run: |
          go vet ./...
          go test -count=1 ./...
      - uses: docker/setup-qemu-action@v3
        with: { platforms: arm64 }
      - uses: docker/setup-buildx-action@v4
      - name: log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: build and push
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          VERSION=${GITHUB_REF_NAME#v}
          TAGS="$VERSION"
          case "$VERSION" in
            *-*) ;;                               # a pre-release: its own tag only
            *) TAGS="$TAGS ${VERSION%.*} latest" ;;
          esac
          main=""; sandbox=""; mail=""; voice=""; browser=""
          for t in $TAGS; do main="$main -t $IMAGE:$t"; sandbox="$sandbox -t $IMAGE-sandbox:$t"; mail="$mail -t $IMAGE-mail:$t"; voice="$voice -t $IMAGE-voice:$t"; browser="$browser -t $IMAGE-browser:$t"; done
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --build-arg VERSION="$GITHUB_REF_NAME" $main .
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            -f sandbox/Dockerfile $sandbox .
          # Plugins (docs/plugins.md): each from its own folder.
          docker buildx build --platform linux/amd64,linux/arm64 --push $mail plugins/mail
          docker buildx build --platform linux/amd64,linux/arm64 --push $voice plugins/voice
          docker buildx build --platform linux/amd64,linux/arm64 --push $browser plugins/browser
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: the published image reports its version on both architectures
        run: |
          for arch in amd64 arm64; do
            out=$(docker run --rm --platform "linux/$arch" "$IMAGE:$VERSION" version)
            echo "$arch: $out"
            test "$out" = "thicket $GITHUB_REF_NAME"
          done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pre=""
          case "$VERSION" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag $pre
