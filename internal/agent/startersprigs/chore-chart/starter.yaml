# Starter metadata: what the package itself can't say (who it's for,
# levels, spend cap). See docs/authoring.md#starter-sprigs.
summary: Keeps the chore rotation fair and the week's who-does-what straight, from the household calendar.
tiers: [family]
offer: when someone mentions chores, whose turn it is, a busy family week, or keeping the household organised
daily_usd: 0.50
# Scheduling and changing routines asks first; everything else starts at draft.
levels:
  schedule_job: ask
  update_job: ask
# Suggested, off until accepted: the day's calendar and chores each
# morning, and a nudge when something noted as due is close.
check_ins:
  morning_brief: "07:30"
  due_reminders: true
