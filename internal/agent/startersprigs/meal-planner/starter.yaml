# Starter metadata: what the package itself can't say (who it's for,
# levels, spend cap). See docs/authoring.md#starter-sprigs.
summary: Plans the week's meals for the household and turns them into one shopping list.
tiers: [family]
offer: when someone mentions dinner planning, the weekly shop, picky eaters, or "what's for dinner"
daily_usd: 0.50
# Scheduling and changing routines asks first; everything else starts at draft.
levels:
  schedule_job: ask
  update_job: ask
# Suggested, off until accepted: a nudge when something noted as due is
# close ("take the chicken out to thaw by 4").
check_ins:
  due_reminders: true
