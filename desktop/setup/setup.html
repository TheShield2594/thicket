<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'">
<title>Connect to Thicket</title>
<link rel="stylesheet" href="setup.css">
</head>
<body>
<main>
  <img class="logo" src="../build/icon.png" alt="">
  <h1>Connect to your Thicket</h1>
  <p class="muted">Enter the address you open Thicket at in a browser.</p>
  <form id="form">
    <label for="server">Server address</label>
    <input id="server" name="server" type="text" placeholder="http://localhost:8080" autocomplete="url" spellcheck="false" autofocus required>
    <p id="error" class="error" role="alert"></p>
    <button id="go" type="submit">Connect</button>
  </form>
  <p class="muted small">Running Thicket on this computer? It’s usually <code>http://localhost:8080</code>.</p>
</main>
<script src="setup.js"></script>
</body>
</html>
