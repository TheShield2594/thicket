# Thicket: one service, one volume. Paste this into Portainer as a stack,
# or run `docker compose up -d`. Set DISCORD_TOKEN, TELEGRAM_TOKEN or both;
# Juni asks for everything else in a DM.
services:
  thicket:
    # Published by CI on every push to main. Without a checkout, Compose
    # pulls this image; inside the repo, `docker compose build` builds it.
    image: ghcr.io/theshield2594/thicket:latest
    build: .
    container_name: thicket
    restart: unless-stopped
    environment:
      # At least one chat app. `thicket check` (and startup) says if neither is set.
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      # Optional. Your user id on either app; otherwise the first person to DM the bot becomes the owner.
      THICKET_OWNER_DISCORD_ID: ${THICKET_OWNER_DISCORD_ID:-}
      THICKET_OWNER_TELEGRAM_ID: ${THICKET_OWNER_TELEGRAM_ID:-}
      # Optional. Public https URL of this server (behind your reverse proxy), used for avatar images.
      THICKET_PUBLIC_URL: ${THICKET_PUBLIC_URL:-}
      # Optional. Keeps the encryption key outside the volume. Any long random string.
      THICKET_SECRET_KEY: ${THICKET_SECRET_KEY:-}
      # Optional. You can also paste the key to Juni in a DM instead.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Optional. A local OpenAI-compatible model server instead of OpenRouter
      # (see docs/local-models.md), e.g. http://host.docker.internal:11434/v1 for Ollama.
      # You can also just send Juni the address in a DM.
      THICKET_MODEL_URL: ${THICKET_MODEL_URL:-}
      THICKET_MODEL_API_KEY: ${THICKET_MODEL_API_KEY:-}
      # Optional. Your SearXNG for web search (see docs/web.md); without it, OpenRouter's is used.
      THICKET_SEARCH_URL: ${THICKET_SEARCH_URL:-}
      # Optional overrides; each can also be changed later by asking Juni.
      THICKET_MODEL: ${THICKET_MODEL:-}
      THICKET_FALLBACK_MODEL: ${THICKET_FALLBACK_MODEL:-}
      THICKET_CHEAP_MODEL: ${THICKET_CHEAP_MODEL:-}
      THICKET_DAILY_BUDGET_USD: ${THICKET_DAILY_BUDGET_USD:-}
      THICKET_MONTHLY_BUDGET_USD: ${THICKET_MONTHLY_BUDGET_USD:-}
      THICKET_ALLOWED_USERS: ${THICKET_ALLOWED_USERS:-}
      THICKET_DISCORD_CHANNELS: ${THICKET_DISCORD_CHANNELS:-}
      THICKET_TELEGRAM_CHATS: ${THICKET_TELEGRAM_CHATS:-}
      THICKET_IDLE_AFTER: ${THICKET_IDLE_AFTER:-}
      THICKET_MESSAGE_RETENTION: ${THICKET_MESSAGE_RETENTION:-}
      THICKET_LOG_LEVEL: ${THICKET_LOG_LEVEL:-}
      TZ: ${TZ:-UTC}
    # Lets the container reach a model server on this machine as host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - thicket-data:/data
    # /health, /avatars and /hooks. Put it behind your reverse proxy for avatars
    # or webhooks (see docs/webhooks.md). Telegram needs no open port.
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  thicket-data:
