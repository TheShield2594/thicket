# Thicket, plus a sandbox computer for sprigs. Paste this into Portainer as a stack,
# or run `docker compose up -d`. Nothing is required: without DISCORD_TOKEN or
# TELEGRAM_TOKEN Thicket runs as a web app only (the sign-in link is in the
# logs). Juni asks for everything else in chat.
services:
  thicket:
    # Released images, for amd64 and arm64 (a Raspberry Pi 4/5 works).
    # `latest` is the newest release. To stay on one version, set
    # THICKET_VERSION (say 0.2.0, or 0.2 for its patch releases) here or
    # in .env; to move to a new one, change it and run
    # `docker compose pull && docker compose run --rm thicket update`
    # then `docker compose up -d` (see docs/operations.md, "Updating").
    # `edge` is whatever is on main. Inside the repo, `docker compose
    # build` builds it instead. The dashboard is part of this service
    # (/dashboard), so there is nothing else to run.
    image: ghcr.io/theshield2594/thicket:${THICKET_VERSION:-latest}
    build: .
    container_name: thicket
    restart: unless-stopped
    environment:
      # Optional chat apps. Leave both empty to use only the web app.
      # Tokens and keys set here are stored encrypted on first start; after
      # that you can delete them from this file. Or never put them here: send
      # the bot token to Juni in the web app and she connects it on the spot
      # (or `docker compose exec thicket thicket secrets set discord_token`).
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      # Optional. Your user id on either app; otherwise the first person to DM the bot becomes the owner.
      THICKET_OWNER_DISCORD_ID: ${THICKET_OWNER_DISCORD_ID:-}
      THICKET_OWNER_TELEGRAM_ID: ${THICKET_OWNER_TELEGRAM_ID:-}
      # Optional. Public https URL of this server (behind your reverse proxy), used for
      # web app sign-in links, webhook URLs and avatar images.
      THICKET_PUBLIC_URL: ${THICKET_PUBLIC_URL:-}
      # Optional. Keeps the encryption key outside the volume. Any long random string.
      THICKET_SECRET_KEY: ${THICKET_SECRET_KEY:-}
      # Or, with Docker secrets (see the commented `secrets:` blocks below):
      # THICKET_SECRET_KEY_FILE: /run/secrets/thicket_secret_key
      # Optional. You can also paste the key to Juni in a DM instead.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Optional single sign-on (Authentik, Authelia, Keycloak...). Needs THICKET_PUBLIC_URL;
      # register <public url>/auth/oidc/callback with the provider. See README "Signing in".
      THICKET_OIDC_ISSUER: ${THICKET_OIDC_ISSUER:-}
      THICKET_OIDC_CLIENT_ID: ${THICKET_OIDC_CLIENT_ID:-}
      THICKET_OIDC_CLIENT_SECRET: ${THICKET_OIDC_CLIENT_SECRET:-}
      THICKET_OIDC_NAME: ${THICKET_OIDC_NAME:-}
      THICKET_OIDC_MEMBER_GROUP: ${THICKET_OIDC_MEMBER_GROUP:-}
      THICKET_OIDC_ADMIN_GROUP: ${THICKET_OIDC_ADMIN_GROUP:-}
      # Optional. A local OpenAI-compatible model server instead of OpenRouter
      # (see docs/local-models.md), e.g. http://host.docker.internal:11434/v1 for Ollama.
      # You can also just send Juni the address in a DM.
      THICKET_MODEL_URL: ${THICKET_MODEL_URL:-}
      THICKET_MODEL_API_KEY: ${THICKET_MODEL_API_KEY:-}
      # Optional. Your SearXNG for web search (see docs/web.md); without it, OpenRouter's is used.
      THICKET_SEARCH_URL: ${THICKET_SEARCH_URL:-}
      # Optional. 1 sends fetch_page through HTTPS_PROXY/HTTP_PROXY, if your network needs one
      # (see docs/web.md for the trade-off). Set those variables here too.
      THICKET_WEB_PROXY: ${THICKET_WEB_PROXY:-}
      # Optional overrides; each can also be changed later by asking Juni.
      THICKET_MODEL: ${THICKET_MODEL:-}
      THICKET_FALLBACK_MODEL: ${THICKET_FALLBACK_MODEL:-}
      THICKET_CHEAP_MODEL: ${THICKET_CHEAP_MODEL:-}
      THICKET_DAILY_BUDGET_USD: ${THICKET_DAILY_BUDGET_USD:-}
      THICKET_MONTHLY_BUDGET_USD: ${THICKET_MONTHLY_BUDGET_USD:-}
      THICKET_ALLOWED_USERS: ${THICKET_ALLOWED_USERS:-}
      THICKET_DISCORD_CHANNELS: ${THICKET_DISCORD_CHANNELS:-}
      THICKET_TELEGRAM_CHATS: ${THICKET_TELEGRAM_CHATS:-}
      # Optional. Matrix is off unless the homeserver and the bot account's access
      # token are both set (or the token is stored: `thicket secrets set matrix_token`).
      # Encrypted rooms aren't supported. See docs/matrix.md.
      THICKET_MATRIX_HOMESERVER: ${THICKET_MATRIX_HOMESERVER:-}
      THICKET_MATRIX_TOKEN: ${THICKET_MATRIX_TOKEN:-}
      THICKET_OWNER_MATRIX_ID: ${THICKET_OWNER_MATRIX_ID:-}
      THICKET_MATRIX_ROOMS: ${THICKET_MATRIX_ROOMS:-}
      THICKET_IDLE_AFTER: ${THICKET_IDLE_AFTER:-}
      THICKET_MESSAGE_RETENTION: ${THICKET_MESSAGE_RETENTION:-}
      THICKET_LOG_LEVEL: ${THICKET_LOG_LEVEL:-}
      TZ: ${TZ:-UTC}
      # Sprigs' computer (the sandbox service below). No sprig can use it until you
      # ask Juni to give one access; commands ask for your approval. Set to "" to turn it off.
      THICKET_SANDBOX_URL: ${THICKET_SANDBOX_URL-http://sandbox:7070}
      THICKET_SANDBOX_TOKEN_FILE: /sandbox-auth/token
    # Lets the container reach a model server on this machine as host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - thicket-data:/data
      - sandbox-auth:/sandbox-auth
    # The web app, /dashboard, /health, /avatars, /hooks and /api/v1. Open
    # http://localhost:8080 on this machine, or put it behind your reverse proxy (with
    # HTTPS) to use it from elsewhere. Telegram needs no open port.
    ports:
      - "127.0.0.1:8080:8080"
    # Thicket needs no Linux capabilities (it runs as a non-root user on
    # port 8080) and never gains any.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # secrets:
    #   - thicket_secret_key

  # Sprigs' own Linux computer: Debian with git, curl, python3 and friends,
  # and a /workspace that keeps their files. It can't see Thicket's data or
  # keys, and it isn't published on any port. It has internet access; remove
  # it from the default network (or delete this service) if you'd rather not.
  sandbox:
    image: ghcr.io/theshield2594/thicket-sandbox:${THICKET_VERSION:-latest}
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    container_name: thicket-sandbox
    restart: unless-stopped
    volumes:
      - sandbox-workspace:/workspace
      - sandbox-home:/home/sprig
      - sandbox-auth:/sandbox-auth:ro
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  thicket-data:
  sandbox-workspace:
  sandbox-home:
  sandbox-auth:

